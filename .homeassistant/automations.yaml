- id: '1791137289670'
  alias: WP - Quiet Mode Steuerung (WW & Nacht)
  description: 'Aktiviert Quiet Mode 3 bei Nachtruhe oder Warmwasserbereitung.

    Bei WW-Aufbereitung, weil zu hohe Leistung mit unserem WW-Speicher nicht funktioniert.
    Wärmeübertragung nicht schnell genug.'
  triggers:
  - entity_id: schedule.nachtruhe_warmepumpe
    trigger: state
  - entity_id: sensor.panasonic_heat_pump_main_threeway_valve_state
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: schedule.nachtruhe_warmepumpe
          state: 'on'
        - condition: state
          entity_id: sensor.panasonic_heat_pump_main_threeway_valve_state
          state: Tank
      sequence:
      - action: select.select_option
        target:
          entity_id: select.panasonic_heat_pump_main_quiet_mode_level
        data:
          option: '3'
    default:
    - action: select.select_option
      target:
        entity_id: select.panasonic_heat_pump_main_quiet_mode_level
      data:
        option: 'Off'
  mode: restart
- id: aquarea_praediktive_raumregelung_shift
  alias: 'Aquarea: Prädiktive Raumregelung (Heizkurven-Shift)'
  description: 'Passt den Heizkurven-Shift (z1_heat_request_temp) anhand der prädiktiven
    Raumtemperatur (Ist-Temperatur EG + 4h-Estrich-Wärmebilanz) an. Beinhaltet Hysterese,
    60 Minuten Mindest-Sperrzeit zur EEPROM-Schonung sowie eine asymmetrische Rampe
    (Absenken sofort, Hochfahren max. +2 K pro Stunde).

    '
  mode: single
  trigger:
  - platform: state
    entity_id: sensor.raumregelung_empfohlener_shift
    for:
      minutes: 15
  - platform: time_pattern
    minutes: /30
  condition:
  - condition: state
    entity_id: input_boolean.raumregelung_automatik_aktiv
    state: 'on'
  - condition: template
    value_template: '{{ ''Heat'' in states(''select.panasonic_heat_pump_main_operating_mode_state'')
      }}

      '
  - condition: template
    value_template: "{% set rec = states('sensor.raumregelung_empfohlener_shift')
      %} {% set cur = states('number.panasonic_heat_pump_main_z1_heat_request_temp')
      %} {{ rec not in ['unavailable', 'unknown', '']\n   and cur not in ['unavailable',
      'unknown', '']\n   and (rec | int) != (cur | int) }}\n"
  - condition: template
    value_template: '{% set last_chg = states.number.panasonic_heat_pump_main_z1_heat_request_temp.last_changed
      %} {{ (now() - last_chg).total_seconds() >= 3600 }}

      '
  action:
  - service: number.set_value
    target:
      entity_id: number.panasonic_heat_pump_main_z1_heat_request_temp
    data:
      value: "{% set rec = states('sensor.raumregelung_empfohlener_shift') | int(0)
        %} {% set cur = states('number.panasonic_heat_pump_main_z1_heat_request_temp')
        | float(0) | round(0) | int %} {% if rec > cur %}\n  {{ [[rec, cur + 2] |
        min, 5] | min }}\n{% elif rec < cur %}\n  {{ [rec, -5] | max }}\n{% else %}\n
        \ {{ cur }}\n{% endif %}\n"
