# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: lueftungssteuerung
  friendly_name: Lueftungssteuerung

esp32:
  variant: esp32s3
  framework:
    type: esp-idf
  # Optional, aber empfohlen für das Waveshare-Board:
  flash_size: 16MB
  
logger:

api:
  encryption:
    key: "EQBYhOe8RHU3qmvrNApd8GsjOfW3i947BhcapJ3he8Q="

# OTA (Over-The-Air Updates)
ota:
  - platform: esphome

    
# ==========================================
# 1. PHASE: WLAN (Aktuell aktiv)
# ==========================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Lueftungssteuer Fallback Hotspot
    password: "3WKwHtE28DEG"

captive_portal:

# ==========================================
# 2. PHASE: ETHERNET / LAN (Für später)
# ==========================================
# Um auf LAN zu wechseln, kommentiere den obigen 'wifi:'- 
# und 'captive_portal:'-Block aus und aktiviere diesen Block:
#
# ethernet:
#   type: W5500
#   clk_pin: GPIO13
#   mosi_pin: GPIO11
#   miso_pin: GPIO12
#   cs_pin: GPIO14

