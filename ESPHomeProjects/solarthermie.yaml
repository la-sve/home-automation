# Board: KinCony KC868-A4
# Definition: definitions/boards/kincony_kc868_a4/manifest.yaml

esphome:
  name: solarthermie
  friendly_name: Solarthermie

esp32:
  variant: esp32

logger:

api:
  encryption:
    key: "ESsUEt43MpVZXevW6Kmif+ctvFFal8GDv0BjMlF1xT0="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Solarthermie Fallback Hotspot
    password: "g4JAuWtWmNAt"

captive_portal:

globals:
    # Um Regelung auszustellen und manuell Werte für Pumpe vorgeben zu können.
  - id: wartungsmodus
    type: bool
    initial_value: 'false'
    # Wert für manuelle Pumpengeschwindigkeitsvorgabe
  - id: manual_pwm_target
    type: float
    initial_value: '0.0'
  - id: current_pwm_val
    type: float
    initial_value: '0.0'

switch:
  - platform: gpio
    pin: 2
    id: relais_solarpumpe
    name: "Solarpumpe 230V"
  - platform: gpio
    pin: 15
    id: relais_zirkulationspumpe
    name: "Zirkulationspumpe 230V"
  - platform: gpio
    pin: 5
    id: relais_WW_1kW
    name: "Warmwasser-Heizstab 1kW"
  - platform: gpio
    pin: 4
    id: relais_WW_2kW
    name: "Warmwasser-Heizstab 2kW"
  # Virtueller Modus-Umschalter für Home Assistant
  - platform: template
    name: "Solarregelung Wartungsmodus"
    id: wartungsmodus_switch
    icon: "mdi:robot"
    optimistic: true
    turn_on_action:
      then:
        - lambda: |-
            id(wartungsmodus) = true;
            // Sicherheitsmechanismus, bei Maximaltemperatur im Speicher nicht einschalten.
            if (id(temp_speicher).state < id(max_speicher_temp).state) {
              id(pwm_solarpumpe).set_level(id(manual_pwm_target));
              id(current_pwm_val) = id(manual_pwm_target);
            }
    turn_off_action:
      then:
        - lambda: id(wartungsmodus) = false;
              
number:
  # Einstellbare Maximaltemperatur für den Speicher über HA
  - platform: template
    name: "Maximaltemperatur Speicher"
    id: max_speicher_temp
    icon: "mdi:thermometer-high"
    min_value: 40
    max_value: 90
    step: 1
    unit_of_measurement: "°C"
    initial_value: 80
    optimistic: true
    mode: slider
  # Virtueller Slider für Home Assistant im manuellen Modus
  - platform: template
    name: "Manuelle Pumpenleistung"
    id: manual_pump_speed
    optimistic: true
    icon: "mdi:pump"
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    initial_value: 0
    set_action:
      then:
        - lambda: |-
            id(manual_pwm_target) = x / 100.0;
            // Blockiere manuelle Steuerung, wenn Speichertemp >= Max-Temp ist
            if (id(wartungsmodus) && id(temp_speicher).state < id(max_speicher_temp).state) {
              id(pwm_solarpumpe).set_level(id(manual_pwm_target));
              id(current_pwm_val) = id(manual_pwm_target);
            }

    
output:
  - platform: ledc       # Muss echtes PWM-Signal sein. 0-10V analog geht nicht.
    pin: 13              # Pin von Temperatursensor, da einziger freier GPIO
    id: pwm_solarpumpe
    frequency: 1000 Hz
    
sensor:
  # Rückmeldung der aktuell einstestellten Pumpenleistung an HA
  - platform: template
    name: "Aktuelle Pumpenleistung"
    id: actual_pump_speed
    icon: "mdi:gauge"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(current_pwm_val) * 100.0;
  # --- KOLLEKTORFÜHLER (NTC 20k an CHA3 / GPIO 32) ---
  - platform: adc
    id: voltage_raw_kollektor
    name: "Spannung am Terminal A3"
    pin: 32
    attenuation: 12db
    update_interval: 2s
    filters:
      # Stoßdämpfer für das 10m Kabel auf dem Dach
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5
      - multiply: 1.515 # Korrekturfaktor für den internen Pegelwandler (Spannungsteiler)
  # 2. ESPHome Resistance Komponente (Widerstand berechnen)
  - platform: resistance
    id: res_kollektor
    name: "Kollektor Widerstand NTC 20k"
    sensor: voltage_raw_kollektor
    configuration: DOWNSTREAM # Referenzwiderstand an Referenzspannung angeschlossen
    resistor: 2.2kOhm         # Referenzwiderstand meines Spannungsteilers
    reference_voltage: 3.29V  # Unsere Referenzspannung vom TEMP/HUM Block
    filters:
      # Herausrechnen des internen 35 kOhm Widerstands (Parallelschaltung)
      # Interner Widerstand wurde per Messreihe mit bekannten Widerständen ermittelt.
      - lambda: |-
          float r_intern = 35000.0; // Der berechnete interne Widerstand in Ohm
          // Sicherheitscheck: Verhindert Division durch Null oder negative Werte
          if (x >= r_intern || x <= 0) return x; 
          return (x * r_intern) / (r_intern - x);
  # 3. NTC Umrechnung mit hochpräziser 3-Punkt-Kalibrierung
  - platform: ntc
    sensor: res_kollektor
    id: temp_kollektor
    name: "Kollektor Temperatur"
    calibration:
      # Format: [Widerstand] -> [Temperatur]
      - 20000.0Ohm -> 25.0°C
      - 5000.0Ohm -> 60.0°C
      - 500.0Ohm -> 140.0°C
  # --- SPEICHERFÜHLER (NTC 10k an CHA4 / GPIO 33) ---
  - platform: adc
    id: voltage_raw_speicher
    name: "Spannung am Terminal A4"
    pin: 33
    attenuation: 12db
    update_interval: 2s
    filters:
      # Mittelwert gegen Störungen
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5
      - multiply: 1.515 # Korrekturfaktor für den internen Pegelwandler (Spannungsteiler)
  - platform: resistance
    id: res_speicher
    name: "Speicher Widerstand NTC 10k"
    sensor: voltage_raw_speicher
    configuration: DOWNSTREAM # Referenzwiderstand an Referenzspannung angeschlossen
    resistor: 4.69kOhm        # Referenzwiderstand meines Spannungsteilers
    reference_voltage: 3.29V  # Unsere Referenzspannung vom TEMP/HUM Block
    filters:
      # Herausrechnen des internen 35 kOhm Widerstands (Parallelschaltung)
      # Interner Widerstand wurde per Messreihe mit bekannten Widerständen ermittelt.
      - lambda: |-
          float r_intern = 35000.0; // Der berechnete interne Widerstand in Ohm
          // Sicherheitscheck: Verhindert Division durch Null oder negative Werte
          if (x >= r_intern || x <= 0) return x; 
          return (x * r_intern) / (r_intern - x);
  - platform: ntc
    sensor: res_speicher
    id: temp_speicher
    name: "Speicher Temperatur"
    calibration:
      # Format: [Widerstand] -> [Temperatur]
      - 10000.0Ohm -> 25.0°C
      - 5000.0Ohm -> 40.0°C
      - 600.0Ohm -> 100.0°C

# --- AUTARKE REGELUNG & INTERVALLPRÜFUNG (V3) ---
interval:
  - interval: 10s
    then:
      - lambda: |-
          float t_koll = id(temp_kollektor).state;
          float t_speicher = id(temp_speicher).state;
          float t_max = id(max_speicher_temp).state;
          
          // 1. FEHLER-CHECK
          if (isnan(t_koll) || isnan(t_speicher) || isnan(t_max)) {
            id(pwm_solarpumpe).set_level(0.0);
            id(current_pwm_val) = 0.0;
            id(relais_solarpumpe).turn_off();
            return;
          }

          // 2. ABSOLUTER ÜBERHITZUNGSSCHUTZ (Greift in jedem Modus!)
          // Vergleicht nun mit dem variablen Wert aus HA
          if (t_speicher >= t_max) {
            id(pwm_solarpumpe).set_level(0.0);
            id(current_pwm_val) = 0.0;
            id(relais_solarpumpe).turn_off();
            return;
          }

          // 3. AUTOMATIK-MODUS
          if (!id(wartungsmodus)) {
            float delta = t_koll - t_speicher;

            if (delta >= 8.0) {
              id(relais_solarpumpe).turn_on();
              
              // Matched Flow: 15% bei Delta 8, 100% bei Delta 20
              float pwm_level = ((delta - 8.0) / 12.0) * 0.85 + 0.15;
              if (pwm_level > 1.0) pwm_level = 1.0;
              
              id(pwm_solarpumpe).set_level(pwm_level);
              id(current_pwm_val) = pwm_level;
            } 
            else if (delta <= 3.0) {
              id(pwm_solarpumpe).set_level(0.0);
              id(current_pwm_val) = 0.0;
              id(relais_solarpumpe).turn_off();
            }
          } 
          
          // 4. MANUELLER MODUS
          else {
            if (id(relais_solarpumpe).state) {
              id(pwm_solarpumpe).set_level(id(manual_pwm_target));
              id(current_pwm_val) = id(manual_pwm_target);
            } else {
              id(pwm_solarpumpe).set_level(0.0);
              id(current_pwm_val) = 0.0;
            }
          }
